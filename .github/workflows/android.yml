name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      # Opsional — isi di Settings > Secrets and variables > Actions untuk APK release bertanda tangan.
      BTM_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      BTM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BTM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      BTM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Versi Gradle dari wrapper
        id: gradle
        run: |
          v="$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true)"
          echo "version=${v:-8.11.1}" >> "$GITHUB_OUTPUT"
          echo "Gradle ${v:-8.11.1}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Build APK debug
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Build APK release (bertanda tangan bila secret tersedia)
        if: env.BTM_KEYSTORE_BASE64 != ''
        run: |
          echo "$BTM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export BTM_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          gradle assembleRelease --stacktrace --no-daemon

      - name: Kumpulkan APK
        id: apk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ver="$(git describe --tags --always 2>/dev/null || echo dev)"
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            type="$(basename "$(dirname "$f")")"
            cp "$f" "$GITHUB_WORKSPACE/dist/btm-monitor-${ver}-${type}.apk"
          done
          ls -l "$GITHUB_WORKSPACE/dist"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: btm-monitor-apk-${{ steps.apk.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Unit test (parser notifikasi bank)
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
